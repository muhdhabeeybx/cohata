services:
  - type: web
    name: cohata-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false   # set this manually in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Netlify URL, e.g. https://your-site.netlify.app
