services:
  - type: web
    name: cohata-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        value: https://your-site.netlify.app  # ← replace with your Netlify URL
    disk:
      name: cohata-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
