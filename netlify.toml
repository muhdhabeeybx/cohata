[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  # Set VITE_API_URL in the Netlify dashboard → Site settings → Environment variables
  # Value: https://cohata-api.onrender.com  (your Render service URL)
  # VITE_API_URL = "https://cohata-api.onrender.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route all requests through the SSR function.
# Static files in dist/client are served by Netlify's CDN first (before this redirect applies),
# so assets, JS, CSS are served directly. Only paths without a matching file hit the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
