[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  # DO NOT set VITE_API_URL here or in the Netlify dashboard.
  # The [[redirects]] rule below proxies /api/* to Render automatically.
  # Setting VITE_API_URL makes the browser call Render directly, which breaks CORS.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api/* to the Render backend — must come before the SSR catch-all.
# This avoids needing VITE_API_URL and keeps all requests same-origin.
[[redirects]]
  from = "/api/*"
  to = "https://cohata.onrender.com/api/:splat"
  status = 200
  force = true

# Route all other requests through the SSR function.
# Static files in dist/client are served directly by Netlify's CDN first.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
